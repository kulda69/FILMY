# Počet karet v sekci Continue Watching na úvodní stránce.
# Mění jen backendové omezení dotazu, ne žádné UI rozložení.
continue_watching_limit = 24

# Počet položek zobrazených po výběru seznamu v My Lists na úvodní stránce.
# Pokud má seznam více položek, zbytek se řeší přes Show all / detail seznamu.
my_lists_selected_limit = 50

# Kolik posledních dní se má počítat do Recently Watched.
# Starší watch eventy zůstávají v databázi, ale tento pohled je ignoruje.
recently_watched_days = 183

# Kolik naposledy přidaných titulů z watchlistu se má zobrazit v Hot Watchlist.
# Řazení je vždy podle data přidání do watchlistu sestupně.
hot_watchlist_limit = 50

# Kolik posledních vyhledávacích mapování si appka drží pro rychlé opakované lookupy.
# Každý záznam je varianta hledaného textu namapovaná na konkrétní titul nebo osobu.
search_recall_limit = 500

# Primární jazyk TMDB detailu pro zobrazení v appce.
# Povolené hodnoty jsou jen "EN" a "CZ"; druhý jazyk se automaticky bere jako fallback.
tmdb_primary_language = "EN"

# První PostgreSQL cutover přepínač pro malou runtime tabulku app.content_state.
# Povolené hodnoty: "duckdb" nebo "postgres". Výchozí a bezpečný stav je "duckdb".
runtime_content_state_backend = "postgres"

# Druhý PostgreSQL cutover přepínač pro app.user_ratings.
# Povolené hodnoty: "duckdb" nebo "postgres". Zatím držíme odděleně od content_state.
runtime_user_ratings_backend = "postgres"

# Třetí PostgreSQL cutover přepínač pro app.watch_events.
# Povolené hodnoty: "duckdb" nebo "postgres".
runtime_watch_events_backend = "postgres"

# Čtvrtý PostgreSQL cutover přepínač pro app.user_lists a app.user_list_items.
# Povolené hodnoty: "duckdb" nebo "postgres".
runtime_user_lists_backend = "postgres"

# Pátý PostgreSQL cutover přepínač pro malý app-state blok:
# app.user_people, favorite_*, genre_scores a search_recall.
# Povolené hodnoty: "duckdb" nebo "postgres".
runtime_app_state_backend = "postgres"

# Šestý PostgreSQL cutover přepínač pro import preview/commit vrstvy:
# app.import_batches a app.import_rows, plus import commit flow na watch_events.
# Povolené hodnoty: "duckdb" nebo "postgres".
runtime_import_backend = "postgres"

# Sedmý PostgreSQL cutover přepínač pro katalogové read modely:
# app.catalog_titles, app.catalog_episodes, app.title_alias_lookup, app.title_lookup a app.person_lookup.
# Povolené hodnoty: "duckdb" nebo "postgres".
runtime_catalog_backend = "postgres"

# Osmý PostgreSQL cutover přepínač pro TMDB runtime tabulky:
# app.tmdb_title_map, app.tmdb_title_details, app.tmdb_watch_providers a app.tmdb_assets.
# Zatím necháváme na duckdb, dokud nejsou převedené i poster joiny v listových read modelech.
runtime_tmdb_backend = "postgres"

# Devátý PostgreSQL cutover přepínač pro katalog meta vrstvu:
# app.imdb_file_manifest, app.catalog_refresh_meta a app.local_seed_meta.
# Samotný katalog zůstává v DuckDB; jde jen o source-of-truth pro refresh metadata a seed guard.
runtime_meta_backend = "postgres"
