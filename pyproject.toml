[project]
name = "filmy"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.138.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.49.0",
]

[project.scripts]
filmy-backfill-tmdb = "filmy.scripts.run_tmdb_backfill:main"
filmy-materialize-title-details = "filmy.scripts.materialize_title_details:main"
filmy-materialize-person-portraits = "filmy.scripts.materialize_person_portraits:main"
filmy-materialize-person-details = "filmy.scripts.materialize_person_details:main"
filmy-jobs-status = "filmy.scripts.background_jobs_status:main"
filmy-sync-plex = "filmy.scripts.sync_plex:main"
filmy-inspect-plex = "filmy.scripts.inspect_plex:main"
filmy-probe-plex = "filmy.scripts.probe_plex_import:main"
filmy-upgrade-database = "filmy.scripts.upgrade_database:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]
